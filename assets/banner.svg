<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(20px) translateX(-20px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rotateOrb {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .grid-line { stroke: #3b82f6; stroke-width: 0.5; animation: pulseGrid 4s ease-in-out infinite; }
      .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle2 5s ease-in-out infinite; }
      .flow-stream { stroke-dasharray: 10, 15; animation: dataFlow 8s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Geometric Grid in Background -->
  <g opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />
    
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Flow Connections (Background / Midground) -->
  <g fill="none" opacity="0.4">
    <path d="M 50 300 Q 300 200 600 280 T 1150 100" stroke="#38bdf8" stroke-width="2" class="flow-stream" />
    <path d="M 50 80 Q 400 160 700 80 T 1150 280" stroke="#a855f7" stroke-width="2" class="flow-stream" style="animation-duration: 6s;" />
  </g>

  <!-- Floating Particles & Glow Nodes -->
  <g>
    <circle cx="150" cy="100" r="4" fill="#60a5fa" class="particle-1" filter="url(#glow)" />
    <circle cx="220" cy="260" r="3" fill="#a855f7" class="particle-2" filter="url(#glow)" />
    <circle cx="980" cy="90" r="5" fill="#38bdf8" class="particle-1" filter="url(#glow)" />
    <circle cx="1060" cy="240" r="4" fill="#818cf8" class="particle-2" filter="url(#glow)" />
    <circle cx="600" cy="40" r="3" fill="#c084fc" class="particle-1" filter="url(#glow)" />
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <!-- Subtle backplate for pristine contrast -->
  <rect x="120" y="55" width="960" height="250" rx="20" fill="#030712" fill-opacity="0.65" stroke="#1f2937" stroke-width="1.5" />

  <!-- Badge Pill -->
  <g transform="translate(480, 80)">
    <rect width="240" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="35" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED RESOURCE HUB</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Metadata Configuration API
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
    Declarative Schemas • Cloud Resource Management • Dynamic Infrastructure as Code
  </text>

  <!-- Tags / Decorative Indicators -->
  <g transform="translate(600, 260)" text-anchor="middle" font-family="monospace" font-size="12">
    <rect x="-240" y="-12" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="-187" y="4" fill="#38bdf8">REST &amp; GraphQL</text>

    <rect x="-120" y="-12" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="-65" y="4" fill="#a855f7">GitOps &amp; IaC</text>

    <rect x="5" y="-12" width="115" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="62" y="4" fill="#34d399">Dynamic Schema</text>

    <rect x="135" y="-12" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="190" y="4" fill="#f43f5e">Cloud Control</text>
  </g>
</svg>
